name: CI

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Verify release tag matches extension version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const packageJson = JSON.parse(await readFile("packages/webextension/package.json", "utf8"));
          const expectedTag = `v${packageJson.version}`;
          if (process.env.RELEASE_TAG !== expectedTag) {
            console.error(`Release tag ${process.env.RELEASE_TAG} does not match extension version ${packageJson.version}.`);
            process.exit(1);
          }
          NODE
      - name: Check out the pinned local extractor dependency
        run: |
          git clone --recurse-submodules https://github.com/ThatXliner/ztractor.git ../ztractor
          git -C ../ztractor checkout eb6725b12b9461f5b80489190d5f266741ebcfff
          git -C ../ztractor submodule update --init --recursive
      - name: Build the local extractor dependency
        working-directory: ../ztractor
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Install and verify the extension
        run: |
          pnpm install --frozen-lockfile
          pnpm run test:release
          pnpm extension:check
          pnpm extension:test
          pnpm --filter @acme/extension test:manifest
          pnpm --filter @acme/extension zip
          pnpm --filter @acme/extension zip:firefox
      - name: Run the Chromium extension flow
        run: |
          pnpm --filter @acme/extension exec playwright install --with-deps chromium
          pnpm --filter @acme/extension test:e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cardcutter-browser-failure
          path: packages/webextension/test-results
      - name: Upload unpacked Chrome extension
        uses: actions/upload-artifact@v4
        with:
          name: cardcutter-chrome-mv3
          path: packages/webextension/.output/chrome-mv3
      - name: Upload release extension packages
        uses: actions/upload-artifact@v4
        with:
          name: extension-release-zips
          path: |
            packages/webextension/.output/cardcutter-*-chrome.zip
            packages/webextension/.output/cardcutter-*-firefox.zip
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'release'
    needs: extension
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release extension packages
        uses: actions/download-artifact@v4
        with:
          name: extension-release-zips
          path: release-assets
      - name: Upload packages to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/*.zip --repo "$GH_REPO" --clobber
