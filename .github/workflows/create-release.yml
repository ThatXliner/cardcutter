name: Create new release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cardcutter-create-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Require the main branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Create new release must be run on main (got $GITHUB_REF)."
            exit 1
          fi

      - name: Read and validate the extension version
        id: version
        run: |
          node --input-type=module <<'NODE'
          import { appendFile, readFile } from "node:fs/promises";

          const packageJson = JSON.parse(await readFile("packages/webextension/package.json", "utf8"));
          const version = packageJson.version;
          const match = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.exec(version);
          if (!match || match.slice(1).some((part) => Number(part) > 65535)) {
            console.error(`Extension version must be a numeric triplet with each component from 0 to 65535: ${version}`);
            process.exit(1);
          }

          const tag = `v${version}`;
          await appendFile(process.env.GITHUB_OUTPUT, `version=${version}\ntag=${tag}\n`);
          NODE

      - name: Check that the tag and release are unused
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          check_absent() {
            local endpoint="$1"
            local description="$2"
            local response status exit_code

            set +e
            response="$(gh api --include "${endpoint}" 2>&1)"
            exit_code=$?
            set -e
            status="$(printf '%s\n' "$response" | sed -nE 's/^HTTP\/[^ ]+ ([0-9]{3}).*/\1/p' | head -n1)"

            if [ "$exit_code" -eq 0 ]; then
              echo "::error::$description $RELEASE_TAG already exists."
              return 1
            fi
            if [ "$status" = "404" ]; then
              return 0
            fi

            echo "::error::Could not check whether $description $RELEASE_TAG exists (gh exit $exit_code, HTTP ${status:-unknown})."
            printf '%s\n' "$response"
            return 1
          }

          check_absent "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" "Git tag"
          check_absent "repos/$GH_REPO/releases/tags/$RELEASE_TAG" "GitHub release"

  build:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download release extension packages
        uses: actions/download-artifact@v4
        with:
          name: extension-release-zips
          path: release-assets

      - name: Verify release packages
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          expected_chrome="cardcutter-${version}-chrome.zip"
          expected_firefox="cardcutter-${version}-firefox.zip"
          mapfile -t assets < <(find release-assets -type f -name '*.zip' -printf '%f\n' | sort)

          if [ "${#assets[@]}" -ne 2 ] || [ "${assets[0]:-}" != "$expected_chrome" ] || [ "${assets[1]:-}" != "$expected_firefox" ]; then
            echo "::error::Expected exactly $expected_chrome and $expected_firefox in release-assets."
            printf 'Found: %s\n' "${assets[@]}"
            exit 1
          fi

      - name: Create the GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            "release-assets/cardcutter-${RELEASE_TAG#v}-chrome.zip" \
            "release-assets/cardcutter-${RELEASE_TAG#v}-firefox.zip" \
            --repo "$GH_REPO" \
            --target "$GITHUB_SHA" \
            --title "Card Cutter $RELEASE_TAG" \
            --notes-file .github/release-notes.md
