packages:
  # all packages in direct subdirs of packages/
  - "packages/*"

# Keep installation reproducible while allowing the native bundler binary WXT
# needs to prepare and build the extension.
allowBuilds:
  core-js: false
  esbuild: true
  spawn-sync: false

# Allow the verified newly published extractor release through pnpm's age gate.
minimumReleaseAgeExclude:
  - ztractor@2.0.0
  - '@ai-sdk/provider-utils@3.0.42'

overrides:
  "@ai-sdk/provider-utils": "^3.0.42"
  "undici": "^6.29.1"
